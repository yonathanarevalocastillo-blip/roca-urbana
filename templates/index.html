
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roca Urbana</title>

  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="stylesheet" href="/static/style.css">

  <style>
    /* INTRO */
    #intro {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 2s ease 2s forwards;
      pointer-events: none;
    }

    #intro img {
      width: 250px;
      max-width: 80%;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* BOTON DE MUSICA */
    #btnMusica {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ff3b3b;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      z-index: 1001;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      #btnMusica {
        bottom: 12px;
        right: 12px;
      }
    }
  </style>
</head>

<body onload="window.scrollTo(0, 0)">

  <!-- INTRO -->
  <div id="intro">
    <img src="/static/logo.png" alt="Roca Urbana">
  </div>

  <!-- MUSICA -->
  <audio id="musica" loop>
    <source src="/static/musica.mp3" type="audio/mpeg">
  </audio>

  <button id="btnMusica" type="button" onclick="toggleMusica()">
    ▶ Música
  </button>

  <script>
    let encendida = false;

    function toggleMusica() {
      const musica = document.getElementById("musica");
      const btn = document.getElementById("btnMusica");

      if (encendida) {
        musica.pause();
        encendida = false;
        btn.innerText = "▶ Música";
      } else {
        musica.play().then(function () {
          encendida = true;
          btn.innerText = "⏸ Pausar";
        }).catch(function () {
          encendida = false;
          btn.innerText = "▶ Música";
        });
      }
    }
  </script>

  <!-- MENU -->
  <nav class="botones">
    <a href="{{ url_for('inicio') }}" class="btn">Inicio</a>
    <a href="{{ url_for('pagina_hombres') }}" class="btn">Hombres</a>
    <a href="{{ url_for('pagina_damas') }}" class="btn">Damas</a>
    <a href="{{ url_for('pagina_contacto') }}" class="btn">Contacto</a>
  </nav>

  <!-- INICIO -->
  <header id="inicio">

    <div class="logo-container">

      <!-- HUMO DETRAS DEL LOGO -->
      <div class="humo humo-rojo"></div>
      <div class="humo humo-azul"></div>
      <div class="humo-central"></div>

      <!-- LOGO -->
      <img
        class="logo"
        src="/static/logo.png"
        alt="Logo Roca Urbana"
      >

    </div>

    <h2>Estilo • Actitud • Calle</h2>
    <p>Suesca - Cundinamarca</p>
    <p>Y&K</p>

  </header>

  <!-- PIE DE PAGINA -->
  <footer>
    © 2026 Roca Urbana | @rocaurbana
  </footer>

</body>
</html>
