<!DOCTYPE html>

<html lang="es"> <head> <meta charset="UTF-8"> <title>Damas | Roca Urbana</title> <link rel="icon" type="image/png" href="/static/logo.png">

<style> html { scroll-behavior:smooth; } body{ margin:0; font-family:Arial,sans-serif; background:#0f0f0f; color:white; } .botones{ display:flex; gap:20px; padding:20px; position:fixed; top:0; left:0; width:100%; justify-content:center; background:rgba(15,15,15,0.7); backdrop-filter:blur(10px); z-index:1000; } .btn{ background:#111; color:white; padding:12px 20px; text-decoration:none; border-radius:10px; transition:0.3s; } .btn:hover{ background:#ff3b3b; transform:scale(1.05); } header{ text-align:center; padding:40px; padding-top:120px; background:linear-gradient(135deg,#111,#1e1e1e); } .logo{ width:1150px; height:600px; border:5px solid rgb(20,20,20); object-fit:cover; animation:glitch 3s infinite,flicker 4s infinite; } @keyframes glitch{ 0%{transform:translate(0);} 20%{transform:translate(-2px,2px);} 40%{transform:translate(2px,-2px);} 60%{transform:translate(-1px,-1px);} 80%{transform:translate(1px,2px);} 100%{transform:translate(0);} } @keyframes flicker{ 0%,100%{ filter:brightness(1.1) drop-shadow(0 0 10px rgba(255,0,0,0.5)); } 50%{ filter:brightness(1.3) drop-shadow(0 0 20px rgba(255,0,0,0.8)); } } .productos{ display:flex; justify-content:center; gap:30px; flex-wrap:wrap; padding:40px; } .card{ background:#1a1a1a; border-radius:15px; width:280px; text-align:center; padding:20px; transition:.3s; } .card:hover{ transform:translateY(-8px); } .card img{ width:100%; height:250px; object-fit:cover; border-radius:12px; } .precio{ color:#4da3ff; font-size:22px; font-weight:bold; } .btn-comprar{ display:inline-block; margin-top:10px; background:#25D366; color:white; padding:10px 15px; border-radius:8px; text-decoration:none; font-weight:bold; } .btn-comprar:hover{ transform:scale(1.05); background:#1ebe5d; } section{ padding:60px 20px; text-align:center; } footer{ text-align:center; padding:30px; background:#111; } .humo{ position:fixed; top:50%; left:-200px; width:500px; height:500px; background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%); filter:blur(60px); opacity:0.6; animation:humoMove 18s linear infinite; z-index:0; pointer-events:none; } .humo2{ top:20%; width:600px; height:600px; opacity:0.4; animation-duration:25s; } .humo3{ top:70%; width:400px; height:400px; opacity:0.5; animation-duration:30s; } @keyframes humoMove{ 0%{transform:translateX(0) scale(1);} 50%{transform:translateX(120vw) scale(1.3);} 100%{transform:translateX(240vw) scale(1);} } </style>

</head>

<body>

<div class="humo"></div> <div class="humo humo2"></div> <div class="humo humo3"></div>

<div class="botones"> <a href="{{ url_for('inicio') }}" class="btn">Inicio</a> <a href="{{ url_for('pagina_hombres') }}" class="btn">Hombres</a> <a href="{{ url_for('pagina_damas') }}" class="btn">Damas</a> <a href="{{ url_for('pagina_contacto') }}" class="btn">Contacto</a> </div>

<header> <img class="logo" src="/static/logo.png"> <h2>Damas</h2> <p>Estilo • Actitud • Calle</p> <p>Suesca - Cundinamarca</p> </header>

<section>

<h2>Damas</h2>

<div class="productos">

{% for producto in damas %}

<div class="card">

<img src="{{ producto.imagen }}">

<h2>{{ producto.nombre }}</h2>

<p class="precio">{{ producto.precio }}</p>

<a class="btn-comprar" href="https://wa.me/573142172714?text=Buen día,%20estoy%20interesado%20en%20el%20producto:%20{{ producto.nombre|urlencode }}%20con%20precio%20de%20{{ producto.precio|urlencode }}.%20¿Podrías%20darme%20más%20información?" target="_blank">
Comprar
</a>

</div>

{% endfor %}

</div>

</section>

<footer> © 2026 Roca Urbana | @rocaurbana </footer>

</body> </html>
